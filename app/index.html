<title>Military Motivex Académie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: una "sala istruzione" notturna. A sinistra il manuale, a destra l'istruttore che lo indica. Su telefono: istruttore + fumetto in alto, pagina sotto, comandi fissi in basso. */
:root{
  --bg:#12150e;          /* verde oliva quasi nero */
  --panel:#1c2016;       /* lavagna */
  --panel-2:#252b1d;
  --line:#3a4230;
  --fg:#ece5cf;          /* bianco képi, caldo */
  --muted:#a9a58f;
  --brass:#d0a84c;       /* ottone delle mostrine */
  --brass-ink:#1a1608;
  --green:#3f8a4c;       /* verde Legione */
  --red:#c8392b;         /* rosso Legione */
  --paper:#f2ecd9;
  --paper-ink:#1d1c16;
  --f-display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse at 70% -10%,rgba(208,168,76,.10),transparent 55%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
img{max-width:100%}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,21,14,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand-mark{width:34px;height:34px;border:2px solid var(--brass);display:grid;place-items:center;font-family:var(--f-display);color:var(--brass);font-size:15px;transform:rotate(45deg)}
.brand-mark span{transform:rotate(-45deg)}
.brand-t{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;line-height:1}
.brand-s{font-family:var(--f-label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top-sp{flex:1}
.rank-chip{display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rank-chip b{color:var(--fg);font-weight:600}
.chev{display:inline-flex;flex-direction:column;gap:2px}
.chev i{display:block;width:16px;height:5px;background:var(--brass);clip-path:polygon(0 0,50% 60%,100% 0,100% 40%,50% 100%,0 40%)}
.chev.red i{background:var(--red)}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-family:var(--f-label);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.icon-btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.icon-btn svg{width:18px;height:18px}
.vpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:19;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.vp-in{padding-block:14px 16px;display:grid;gap:12px;max-width:760px}
.vp-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-label);font-size:20px}
.vp-note{margin:0;color:var(--muted);font-size:15px}
.vp-list{display:grid;gap:14px;max-height:46vh;overflow:auto;padding-right:4px}
.vp-grp{display:grid;gap:6px}
.vp-grp b,.vp-grp summary{font-family:var(--f-label);font-size:16px;letter-spacing:.04em;cursor:pointer}
.vp-row{display:flex;flex-wrap:wrap;gap:8px}
.vp-v{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:8px 12px;font-size:15px;text-align:left}
.vp-v[aria-checked="true"]{border-color:var(--brass);color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.vp-v small{display:block;color:var(--muted);font-size:12px}
.vp-sl label{font-family:var(--f-label);font-size:17px;font-weight:600}
.vp-sl label span{color:var(--brass);font-variant-numeric:tabular-nums}
.vp-sl input{width:100%;accent-color:var(--brass)}
.vp-scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
@media (max-width:560px){.rank-chip .lbl{display:none}.brand-s{display:none}.icon-btn .lbl{display:none}}
.del-box{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.btn.danger{background:#a8322a;color:#fff;border-color:#a8322a}.set-card a{color:var(--brass)}
.st-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.st-tile{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px}.st-v{font-size:22px;font-weight:800}.st-l{font-size:12px;opacity:.8}
@media (min-width:640px){.st-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.set-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}.set-card .btn{white-space:normal;max-width:100%}.set-card{cursor:default;padding:16px}.set-card h3{margin:0 0 8px}.set-card p{margin:4px 0 10px}.set-card form{display:flex;gap:8px;flex-wrap:nowrap}.set-card input{flex:1;min-width:0}
@media (min-width:760px){.set-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:460px){.top .wrap{gap:5px}.icon-btn{padding:6px 7px}#langBtn{border-color:transparent;background:none;padding:6px 3px}.brand-mark{display:none}.brand-t{font-size:16px}.rank-chip{font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank-chip b{overflow:hidden;text-overflow:ellipsis}}
@media (max-width:380px){.rank-chip{display:none}}

/* ---------- instructor ---------- */
.instr{position:relative;aspect-ratio:359/769;height:100%;max-width:100%;flex:none;user-select:none;-webkit-user-select:none}
.instr .lay{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.instr .shadow{position:absolute;left:18%;right:8%;bottom:-1.5%;height:3%;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(4px)}
.instr .body{background-image:url(img/body.webp);transform-origin:60% 100%}
.instr .arm{background-image:url(img/arm.webp);transform-origin:34.1% 43.2%}
.instr .head{transform-origin:64.5% 19.5%}
.instr .head .hd{position:absolute;inset:0;background-image:url(img/head.webp);background-size:100% 100%}
.instr .lid{position:absolute;top:11.4%;width:4.5%;height:1.3%;background:linear-gradient(180deg,#9c5631,#c27b4f);border-radius:50% 50% 40% 40%;box-shadow:inset 0 -1px 0 rgba(70,25,10,.7);transform:scaleY(0);transform-origin:50% 0}
.instr .lid.l{left:57.05%}.instr .lid.r{left:66.95%}
.instr .mouth{position:absolute;left:62.4%;top:15.75%;width:4.1%;height:1%;border-radius:45% 45% 55% 55%;background:radial-gradient(ellipse at 50% 40%,#2a0905 0 45%,#6a2010 80%);transform:scaleY(0);transform-origin:50% 25%}
.instr .rig{position:absolute;inset:0;transform-origin:60% 100%}
/* idle */
.instr .rig{animation:breathe 4.2s ease-in-out infinite}
.instr .head{animation:headIdle 6s ease-in-out infinite}
.instr .lid{animation:blink 5.2s infinite}
.instr .arm{animation:armIdle 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.004,1.012)}}
@keyframes headIdle{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.4deg)}70%{transform:rotate(1.2deg)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(0)}47.5%,48.5%{transform:scaleY(1)}}
@keyframes armIdle{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
/* niente palpebre/bocca disegnate: a grandezza reale sembravano macchie */
.instr .lid,.instr .mouth{display:none!important}
/* figura intera (chat): un'unica immagine ad alta definizione */
.instr .full{background-image:url(img/full.webp)}
.instr.solo .rig{animation:soloIdle 5s ease-in-out infinite;transform-origin:50% 100%}
.instr.solo.talking .rig{animation:soloTalk 1.6s ease-in-out infinite}
@keyframes soloIdle{0%,100%{transform:scale(1)}50%{transform:scale(1.006,1.012)}}
@keyframes soloTalk{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-.6deg) scale(1.008)}50%{transform:rotate(0) scale(1.014)}75%{transform:rotate(.5deg) scale(1.006)}}
/* bocca vera (fotogrammi ricavati dalla foto): si apre e si chiude mentre parla */
.instr .mth{position:absolute;left:58.496%;top:15.345%;width:11.978%;height:4.421%;background:url(img/mouth.webp) 0 0/100% 400% no-repeat;opacity:0;pointer-events:none}
.instr.talking .mth{opacity:1;animation:mouthTalk 1.15s steps(1,end) infinite}
body.lipjs .instr.talking .mth{animation:none}
@keyframes mouthTalk{0%{background-position:0 66.667%}9%{background-position:0 33.333%}18%{background-position:0 100%}27%{background-position:0 0}34%{background-position:0 66.667%}45%{background-position:0 100%}55%{background-position:0 33.333%}63%{background-position:0 0}70%{background-position:0 66.667%}80%{background-position:0 33.333%}90%{background-position:0 100%}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.instr.talking .mth{animation-duration:2.3s}}
/* talking */
.instr.talking .mouth{animation:talk .32s ease-in-out infinite alternate}
.instr.talking .head{animation:nod 1.6s ease-in-out infinite}
.instr.talking .arm{animation:gesture 2.2s ease-in-out infinite}
@keyframes talk{0%{transform:scaleY(.1)}35%{transform:scaleY(.95)}60%{transform:scaleY(.4)}100%{transform:scaleY(.8)}}
@keyframes nod{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-2deg) translateY(.3%)}55%{transform:rotate(1.6deg)}80%{transform:rotate(-.6deg) translateY(.2%)}}
@keyframes gesture{0%,100%{transform:rotate(0)}18%{transform:rotate(-7deg)}30%{transform:rotate(-3deg)}46%{transform:rotate(-8deg)}62%{transform:rotate(2deg)}80%{transform:rotate(-4deg)}}
/* reactions */
.instr.happy .rig{animation:jump .7s cubic-bezier(.3,.7,.4,1) 2}
.instr.happy .arm{animation:cheer .7s ease-in-out 2}
.instr.happy .mouth{transform:scaleY(.7);animation:none}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.03,.96)}50%{transform:translateY(-7%) scale(.98,1.03)}80%{transform:translateY(0) scale(1.02,.98)}}
@keyframes cheer{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
.instr.sad .head{animation:shake .55s ease-in-out 2}
.instr.sad .rig{animation:none;transform:rotate(-1deg)}
.instr.sad .arm{animation:wag .55s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}}
@keyframes wag{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-12deg)}}
.instr.enter{animation:enter .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes enter{from{opacity:.0;transform:translateX(18%)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.instr *:not(.mth),.instr{animation:none!important}}

/* ---------- bubble ---------- */
.bubble{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:17px;line-height:1.55}
.bubble::after{content:"";position:absolute;width:22px;height:22px;background:var(--paper);transform:rotate(45deg)}
.bubble .who{font-family:var(--f-label);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#7b6a3a;font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bubble .who .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.talking-ind .dot{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--f-label);font-size:14px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:4px;background:#e2d8b9;color:#3b3317;border:1px solid #cdbf93}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-block:28px 8px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,6.4vw,76px);line-height:.95;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--brass)}
.eyebrow{font-family:var(--f-label);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hero p.lead{max-width:56ch;color:#d4ceb8;font-size:17px;margin:10px 0 18px}
.hero .bubble{max-width:520px;margin-top:6px}
.hero .bubble::after{right:-9px;bottom:38px}
.hero-fig{height:min(54vh,470px);display:flex;align-items:flex-end;padding-right:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:12px 18px;font-family:var(--f-label);font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--brass);color:var(--brass-ink);box-shadow:0 2px 0 #7d6326}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.green{background:var(--green);color:#fff;box-shadow:0 2px 0 #24522c}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:18px 0 6px}
.stat{background:var(--panel);padding:12px 14px}
.stat .v{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-family:var(--f-label);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.sec-h span{font-family:var(--f-label);color:var(--muted);letter-spacing:.08em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-bottom:40px}
.card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#5b6545}
.card .num{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--brass)}
.card .ttl{font-family:var(--f-label);font-weight:700;font-size:21px;line-height:1.1;letter-spacing:.01em}
.card .fr{font-size:14px;color:var(--muted);font-style:italic}
.card .meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-size:14px;letter-spacing:.04em;color:var(--muted)}
.card .bar{flex:1;height:5px;background:#2e3426;border-radius:3px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--green)}
.stamp{position:absolute;top:12px;right:12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;color:var(--green);border:2px solid var(--green);padding:1px 7px;transform:rotate(6deg);border-radius:3px}
.stamp.todo{color:var(--muted);border-color:#4a5240}
.card.final{background:linear-gradient(135deg,#2a2412,#1c2016);border-color:#6b5726}
.card.final .num{color:var(--red)}

/* ---------- lesson ---------- */
.view{padding-block:18px 120px}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.crumb .back{background:none;border:0;color:var(--muted);font-family:var(--f-label);font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:4px 0}
.crumb h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.4vw,32px);margin:0;line-height:1.1;flex-basis:100%}
.crumb .mode{font-family:var(--f-label);font-size:13px;letter-spacing:.16em;text-transform:uppercase;background:var(--panel-2);border:1px solid var(--line);padding:2px 8px;border-radius:3px;color:var(--brass)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:22px;align-items:start}
.page{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;position:relative}
.page img{display:block;width:100%;height:auto;border-radius:4px;cursor:zoom-in;background:#0c0e09;min-height:200px}
.page .cap{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-label);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 2px 0}
.stage{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;height:calc(100vh - 252px);min-height:420px}
.stage>.stage-fig{flex:1 1 auto;min-height:170px;height:auto}
.stage .bubble::after{left:46%;bottom:-9px}
.stage-fig{height:clamp(240px,calc(100vh - 430px),500px);display:flex;justify-content:center}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:5px;border-radius:2px;background:#353c2b}
.dots i.on{background:var(--brass)}
.dots i.done{background:#6d6236}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(18,21,14,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.controls .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.controls .count{font-family:var(--f-label);font-size:16px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.controls .grow{flex:1}

@media (max-width:900px){
  .lesson{grid-template-columns:minmax(0,1fr)}
  .stage{position:static;order:-1;flex-direction:row;align-items:flex-end;gap:10px;height:auto;min-height:0}
  .stage .bubble{flex:1;min-width:0;font-size:16px;align-self:center}
  .stage .bubble::after{left:auto;right:-9px;bottom:auto;top:40%}
  .stage>.stage-fig,.stage-fig{height:230px;flex:none}
  .hero{grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .hero-fig{height:300px}
}
@media (max-width:560px){
  /* téléphone : même composition que la tablette (seulement un peu plus compact) */
  .hero .bubble,.stage .bubble,.qside .bubble{font-size:13.5px;line-height:1.42;padding:11px 12px}
  .hero{align-items:center}.hero-fig{height:250px}
  .stage{align-items:center}.stage>.stage-fig,.stage-fig{height:210px}
  .chip,.bubble .tags span{font-size:12px}
  .stats .stat .v{font-size:22px}
  .controls .btn{padding:11px 12px;font-size:15px}
  .controls .lbl{display:none}
  .controls .dots{display:none}
  .controls .wrap{gap:8px}
}

/* ---------- quiz ---------- */
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:14px}
.score-pill{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--fg);font-variant-numeric:tabular-nums}
.qtext{font-family:var(--f-label);font-weight:700;font-size:clamp(21px,2.6vw,27px);line-height:1.2;margin:4px 0 14px;text-wrap:balance}
.qimg{display:block;width:100%;max-height:52vh;object-fit:contain;background:#0c0e09;border-radius:6px;margin-bottom:14px;cursor:zoom-in}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:17px;line-height:1.35;transition:background .15s,border-color .15s,transform .1s}
.opt:hover:not(:disabled){border-color:#6a7552;background:#2c3322}
.opt:active:not(:disabled){transform:scale(.99)}

/* Synchronisation labiale : la bouche suit les syllabes du texte lu.
   Image de la bouche : 4 positions (0 fermée, 1 entrouverte, 2 ouverte, 3 grande ouverte).
   Recalée sur chaque mot quand la voix envoie ses repères (onboundary / onRangeStart). */
const LIP = (() => {
  const OPEN = /[aàâáäãåoòôóöõаояё]/i, MID = /[eéèêëiìíîïεеэиыіæœ]/i, ROUND = /[uùúûüyÿуюwö]/i, LIPS = /[mbpвмбпf]/i;
  let tl = [], t0 = 0, raf = 0, on = false, rate = 1, text = '';
  function build(str){
    const out = []; let t = 0;
    const cps = 13.5 * rate; // caractères par seconde, environ, pour une voix normale
    for (let i = 0; i < str.length; i++) {
      const ch = str[i]; let f, dur = 1 / cps;
      if (/\s/.test(ch)) { f = 1; dur *= .6; }
      else if (/[,;]/.test(ch)) { f = 0; dur = .18 / rate; }
      else if (/[.!?:…]/.test(ch)) { f = 0; dur = .32 / rate; }
      else if (OPEN.test(ch)) f = 3;
      else if (MID.test(ch)) f = 2;
      else if (ROUND.test(ch)) f = 1;
      else if (LIPS.test(ch)) f = 0;
      else if (/[぀-ヿ一-鿿가-힯]/.test(ch)) { f = (i % 2) ? 2 : 3; dur = .17 / rate; } // japonais, chinois : une syllabe par signe
      else if (/[؀-ۿऀ-ॿ]/.test(ch)) f = [1, 3, 2, 1][i % 4]; // arabe, népalais
      else f = 1;

    }
    out.push({ t, i: str.length, f: 0 });
    return out;
  }

    if (!on) return;
    const now = (performance.now() - t0) / 1000;
    let k = 0; while (k + 1 < tl.length && tl[k + 1].t <= now) k++;
    const cur = tl[k];
    // entre deux lettres ouvertes, on garde une petite fermeture pour l'effet « syllabe »
    paint(cur ? cur.f : 0);

    start(str, r){ text = String(str || ''); rate = Math.max(.5, r || 1); tl = build(text); t0 = performance.now(); on = true; document.body.classList.add('lipjs'); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); },

/* ---------- LESSON ---------- */
function lesson(c, i){
  state.view = 'lesson'; state.c = c; state.i = i; if (!i) STATS.hit('lesson');
  const L = c.lesson, s = L[i], last = i === L.length - 1;

        <aside class="stage">

      <span class="grow"><span class="dots" id="dots"></span></span>
      <button class="btn ghost" id="replay" title="Réécouter">↻<span class="lbl"> Répéter</span></button>
      <span class="count" id="count" dir="ltr"></span>
      <button class="btn" id="next"></button>
    </div></nav>`;
    document.getElementById('bk').onclick = home;
    if (!c.flang) document.getElementById('pgwrap').onclick = () => { revealAll(); lightbox(pimg(state.c.lesson[state.i].p), 'Page du manuel'); };

    document.getElementById('next').onclick = () => {

      else { prog(c.id).lesson = true; if (!c.quiz.length) { prog(c.id).best = 1; save(); toast('Module terminé. Bravo !'); home(); return; } save(); if (c.id === 'drones') droneView(c); else quiz(c); }
    };

  document.getElementById('chips').innerHTML = (s.k || []).map(k => `<span class="chip">${esc(k)}</span>`).join('');
  document.querySelectorAll('.imc-open').forEach(x => x.remove());
  if (/masse corporelle/i.test(s.t)) {
    document.getElementById('chips').insertAdjacentHTML('afterend', `<button class="btn imc-open" id="imcOpen">⚖ Calculer mon IMC</button>`);

  document.getElementById('dots').innerHTML = L.map((_, j) => `<i class="${j === i ? 'on' : j < i ? 'done' : ''}"></i>`).join('');
  document.getElementById('count').textContent = (i + 1) + ' / ' + L.length;
  document.getElementById('prev').disabled = i === 0;

  speak(s.t, null, revealAll, revealStep);
  if (window.innerWidth <= 900) top();
}

/* ---------- COURS DE FRANÇAIS (pour les étrangers) ---------- */
function frVoice(){
  let all = []; try { all = allVoices() || []; } catch(e){}
  const fr = all.filter(v => /^fr/i.test(v.lang || ''));
  return fr.find(v => /thomas|x-frd|x-vlf/i.test(v.name + ' ' + (v.voiceURI || ''))) || fr.find(v => isMale(v)) || fr[0] || null;
}
function sayFr(text){
  stopTalk(); const my = ++talkToken; const clean = String(text).replace(/[«»]/g, '');
  const CP = window.Capacitor, TT = CP && CP.Plugins && CP.Plugins.TextToSpeech;
  const v = frVoice();
  document.querySelectorAll('.instr').forEach(el => el.classList.add('talking'));
  const end = () => { if (my === talkToken) { LIP.stop(); document.querySelectorAll('.instr').forEach(el => el.classList.remove('talking')); } };
  LIP.start(clean, .85);
  if (TT && CP.isNativePlatform && CP.isNativePlatform()) {
    const o = { text: clean, lang: 'fr-FR', rate: .85, pitch: 1, volume: 1, category: 'ambient', queueStrategy: 0 };
    try { if (typeof nativeVoices !== 'undefined' && v) { const vi = nativeVoices.indexOf(v); if (vi >= 0) o.voice = vi; } } catch(e){}
    TT.speak(o).then(end, end); return;
  }
  if (!synth) { setTimeout(end, 1500); return; }
  try { const u = new SpeechSynthesisUtterance(clean); u.lang = 'fr-FR'; if (v) u.voice = v; u.rate = .85; u.onend = end; u.onerror = end; if (synth.resume) synth.resume(); synth.speak(u); } catch(e){ end(); }
}
function frCard(s, i){
  const box = document.getElementById('frcard'); if (!box) return;
  box.innerHTML = `<div class="fr-h">🇫🇷 Leçon ${i + 1}</div>` + (s.w || []).map((x, j) => `<button class="fr-row" type="button" data-j="${j}"><span class="fr-spk" aria-hidden="true">🔊</span><span class="fr-txt"><b class="notr" translate="no" lang="fr">${esc(x.f)}</b><small>${esc(x.g)}</small></span></button>`).join('')
    + '<p class="fr-tip">Touchez une phrase pour l\'écouter en français, puis répétez-la à voix haute.</p>';
  box.querySelectorAll('.fr-row').forEach(b => b.onclick = () => { box.querySelectorAll('.fr-row').forEach(x => x.classList.remove('on')); b.classList.add('on'); sayFr(s.w[+b.dataset.j].f); });
}

/* ---------- QUIZ ---------- */
function buildQuestions(list){
  return list.map(q => {
    const idx = (q.ofr || q.o).map((_, k) => k);
    const order = (q.img || q.pic) ? idx : shuffle(idx);
    const correct = Array.isArray(q.a) ? q.a : [q.a];
    return Object.assign({}, q, { order, correct });
  });
}
function quiz(c, opts){
  opts = opts || {};
  const qs = opts.questions || buildQuestions(c.quiz);
  state.view = 'quiz'; state.qs = qs; state.qi = 0; state.score = 0; state.answers = []; state.c = c; state.final = !!opts.final;
  app.innerHTML = `<div class="wrap view">
    <div class="crumb"><button class="back" id="bk">← Chapitres</button><span class="mode">${opts.final ? 'Examen final' : 'Quiz · Chapitre ' + c.n}</span><h2>${opts.final ? 'Examen final du manuel' : esc(c.title)}</h2></div>
    <div class="quiz">
      <section class="qcard" id="qcard" aria-live="polite"></section>
      <aside class="qside">
        <div class="bubble"><div class="who"><span class="dot"></span>Instructeur</div><div id="qsay"></div></div>
        <div class="stage-fig">${instrHTML('enter')}</div>
      </aside>
    </div></div>`;
  document.getElementById('bk').onclick = home;
  const intro = opts.final ? "Examen final. Vingt-cinq questions sur tout le manuel. Concentrez-vous, recrue." : "Voyons maintenant ce que vous avez compris. Lisez bien chaque réponse avant de choisir.";
  document.getElementById('qsay').textContent = intro;
  speak(intro);
  showQ();
}
function showQ(){
  const q = state.qs[state.qi], n = state.qs.length;
  const letters = 'ABCDE';
  const card = document.getElementById('qcard');
  card.innerHTML = `
    <div class="qhead"><span>Question ${state.qi + 1} sur ${n}${q._ch ? ' · Chap. ' + q._ch : ''}</span><span class="score-pill">Points ${state.score}</span></div>
    ${q.img ? `<img class="qimg" src="img/${q.img}.jpg" alt="Développement du cube et quatre dés proposés">` : ''}${q.pic ? `<img class="qimg qpic" src="img/${q.pic}.webp" alt="Figure de la question">` : ''}
    ${q.qf ? `<button class="qfr notr" translate="no" id="qfr" type="button">🔊 ${esc(q.qf)}</button>` : ''}<div class="qtext fade-in">${esc(q.q)}</div>
    <div class="opts" role="group" aria-label="Réponses">${q.order.map((k, pos) => `<button class="opt" data-k="${k}"><span class="l">${q.img ? q.o[k].length > 1 ? 'E' : esc(q.o[k]) : letters[pos]}</span><span>${q.ofr ? `<span class="notr" translate="no">${esc(q.ofr[k])}</span>` : q.img && q.o[k].length === 1 ? 'Dé ' + esc(q.o[k]) : esc(q.o[k])}</span></button>`).join('')}</div>
    <div id="explHost"></div>`;
  const qi = card.querySelector('.qimg'); if (qi) qi.onclick = () => lightbox(qi.src, 'Question');
  card.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
  const qfr = document.getElementById('qfr'); if (qfr) { qfr.onclick = () => sayFr(q.qf); setTimeout(() => { if (state.qs[state.qi] === q) sayFr(q.qf); }, state.qi > 0 ? 2600 : 3600); }
  if (state.qi > 0) { document.getElementById('qsay').textContent = q.q; speak(q.q); }
  if (window.innerWidth <= 900 && state.qi > 0) card.scrollIntoView({block:'start', behavior:'smooth'});
}
const PRAISE = ["Exact !", "Bravo, recrue !", "Correct !", "Parfait !", "C'est ça !"];
const BLAME = ["Non, c'est faux.", "Négatif.", "Ce n'est pas ça.", "Attention, recrue."];
function answer(k){
  const q = state.qs[state.qi];
  const ok = q.correct.includes(k);
  if (ok) state.score++;
  state.answers.push({q, k, ok});
  const card = document.getElementById('qcard');
  card.querySelectorAll('.opt').forEach(b => {
    const kk = +b.dataset.k; b.disabled = true;
    if (q.correct.includes(kk)) b.classList.add('ok');
    else if (kk === k) b.classList.add('bad');
  });
  card.querySelector('.score-pill').textContent = 'Points ' + state.score;
  const head = ok ? PRAISE[Math.floor(Math.random()*PRAISE.length)] : BLAME[Math.floor(Math.random()*BLAME.length)];
  const last = state.qi === state.qs.length - 1;
  document.getElementById('explHost').innerHTML = `
    <div class="expl ${ok ? '' : 'wrong'} fade-in">
      <h4>${esc(head)}</h4><p>${esc(q.e)}</p>
      ${q.ep ? `<img src="${pimg(q.ep)}" alt="Solution du manuel, page ${q.ep}" id="eimg">` : ''}
    </div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="nq">${last ? 'Voir le résultat ▶' : 'Question suivante ▶'}</button></div>`;
  const ei = document.getElementById('eimg'); if (ei) ei.onclick = () => lightbox(ei.src, 'Solution');
  document.getElementById('qsay').textContent = head + ' ' + q.e;
  react(ok ? 'happy' : 'sad');
  speak(head + ' ' + q.e);
  const nq = document.getElementById('nq');
  nq.onclick = () => { if (last) result(); else { state.qi++; showQ(); } };
  nq.focus({preventScroll:true});
  if (window.innerWidth <= 900) document.getElementById('explHost').scrollIntoView({block:'nearest', behavior:'smooth'});
}

/* ---------- RESULT ---------- */
function result(){ try { STATS.hit('quiz'); } catch(e){}
  const n = state.qs.length, sc = state.score, r = sc / n, pass = r >= PASS, c = state.c;
  const before = currentRank().n;
  if (state.final) { if (store._final == null || r > store._final) store._final = r; }
  else { const p = prog(c.id); p.lesson = true; if (p.best == null || r > p.best) p.best = r; }
  save(); renderRank();
  const after = currentRank().n;
  const promoted = after !== before;
  const nextC = !state.final ? C[C.indexOf(c) + 1] : null;
  let msg = pass ? `Reçu. Vous avez bien répondu à ${sc} questions sur ${n}.` : `Ce n'est pas suffisant. ${sc} sur ${n}. Il vous faut au moins soixante-dix pour cent. Revoyez la leçon et recommencez.`;
  if (promoted) msg += ` Félicitations : vous êtes maintenant ${after} !`;
  app.innerHTML = `<div class="wrap view">
    <div class="crumb"><button class="back" id="bk">← Chapitres</button><span class="mode">${state.final ? 'Examen final' : 'Résultat · Chapitre ' + c.n}</span><h2>${state.final ? 'Examen final' : esc(c.title)}</h2></div>
    <div class="result">
      <div>
        <div class="big">${sc}<small>/${n}</small></div>
        <div class="verdict ${pass ? 'pass' : 'fail'}">${pass ? 'Reçu' : 'À refaire'} · ${Math.round(r*100)}%</div>
        <div class="bubble fade-in" style="max-width:560px"><div class="who"><span class="dot"></span>Instructeur</div>${esc(msg)}</div>
        <div class="row" style="margin-top:18px">
          ${pass && nextC ? `<button class="btn" id="nextC">Chapitre ${nextC.n} : ${esc(nextC.title)} ▶</button>` : ''}
          ${!pass && !state.final ? `<button class="btn" id="relearn">Revoir la leçon</button>` : ''}
          <button class="btn ${pass && nextC ? 'ghost' : (state.final || pass ? '' : 'ghost')}" id="again">Refaire ${state.final ? "l'examen" : 'le quiz'}</button>
          <button class="btn ghost" id="toHome">Chapitres</button>
        </div>
      </div>

/* ---------- BIP-TEST LUC LÉGER (navetta 20 m) ----------
   Protocollo: partenza 8,5 km/h, +0,5 km/h a ogni palier di circa 1 minuto.
   Tempo per 20 m = 72 / velocità (km/h). Un bip a ogni 20 m, triplo bip al cambio di palier. */
const LG = window.LEGER_TXT;
const LEGER_MAX = 20;
function legerPlan(){
  const plan = []; let t = 0;
  for (let k = 1; k <= LEGER_MAX; k++) {
    const v = 8 + 0.5 * k, dt = 72 / v, n = Math.round(60 / dt);
    plan.push({k, v, dt, n, start: t}); t += n * dt;

  g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
  g.gain.setValueAtTime(vol, at + dur - 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + dur + 0.02);
}

async function legerStart(){

/* ---------- MUSIQUE DE FOND ----------
   Lettore audio semplice (niente Web Audio: su iPhone zittiva la voce dell'istruttore).
   Il file music.mp3 è già abbassato di 20 dB: resta un sottofondo su ogni telefono.
   Parte al primo tocco, in loop; si abbassa ancora quando parla l'istruttore (dove il telefono lo permette)
   e si mette in pausa durante il bip-test. */
const MUSIC_ERR = 'Musique : le fichier audio ne peut pas être lu sur cet appareil.';
const bgm = { el: null, on: store._music !== false, vol: store._musicVol3 != null ? store._musicVol3 : 1, duck: false, hold: false, started: false };
function bgmTarget(){ return (bgm.on && !bgm.hold && !bgm.duck) ? bgm.vol : 0; }
function bgmApply(){
  if (!bgm.el) return;
  const t = bgmTarget();
  try { bgm.el.volume = Math.max(0, Math.min(1, t)); } catch(e){}
  if (t > 0) { if (bgm.el.paused) { const p = bgm.el.play(); if (p && p.catch) p.catch(err => { bgm.lastErr = err && err.name; if (err && err.name === 'NotSupportedError') toast(MUSIC_ERR); }); } }
  else if (!bgm.el.paused) bgm.el.pause();
}
function bgmInit(){
  if (bgm.started) return; bgm.started = true;
  try {
    bgm.el = new Audio(window.MUSIC_SRC || 'music.mp3'); bgm.el.loop = true; bgm.el.preload = 'auto'; bgm.el.setAttribute('playsinline', '');
    bgm.el.addEventListener('error', () => toast(MUSIC_ERR));
    bgm.el.addEventListener('ended', () => { try { bgm.el.currentTime = 0; } catch(e){} bgmKeepAlive(); });
  } catch(e){ bgm.el = null; }
  // al primo tocco la musica viene solo "sbloccata" in silenzio: prima parla l'istruttore,
  // la musica parte quando lui ha finito (o subito, se non sta parlando)
  if (bgm.el) {
    try { bgm.el.muted = true; const pr = bgm.el.play(); bgm.el.pause(); if (pr && pr.catch) pr.catch(() => {}); } catch(e){}
    setTimeout(() => { try { bgm.el.pause(); bgm.el.currentTime = 0; bgm.el.muted = false; } catch(e){} }, 120);
  }
  bgm.justStarted = false;
  setTimeout(bgmKeepAlive, 700);
}
function bgmDuck(on){
  bgm.duck = on;
  if (!bgm.el) return;
  // il telefono non riesce a far sentire voce e musica insieme: la musica si ferma mentre l'istruttore parla
  if (on) { if (!bgm.el.paused) bgm.el.pause(); }
  else { clearTimeout(bgm.rt); bgm.rt = setTimeout(bgmKeepAlive, 400); }
}
function bgmKeepAlive(){
  if (!bgm.el || !bgm.on || bgm.hold || document.hidden) return;
  if (bgm.el.paused && !bgm.duck) { const p = bgm.el.play(); if (p && p.catch) p.catch(err => { bgm.lastErr = err && err.name; }); }
}
setInterval(bgmKeepAlive, 1000);
function bgmHold(on){ bgm.hold = on; bgmApply(); }
function renderMusic(){
  const b = document.getElementById('musicBtn'); b.setAttribute('aria-pressed', String(bgm.on));
  document.getElementById('musicX').style.display = bgm.on ? 'none' : '';
  const r = document.getElementById('vpMusic'); r.value = bgm.vol; document.getElementById('vpMusicV').textContent = Math.round(bgm.vol * 100) + '%';
}
document.getElementById('musicBtn').addEventListener('click', () => { bgm.on = !bgm.on; store._music = bgm.on; save(); renderMusic(); if (!bgm.started) bgmInit(); else bgmApply(); });
document.getElementById('vpMusic').addEventListener('input', e => { bgm.vol = +e.target.value; store._musicVol3 = bgm.vol; save(); renderMusic(); if (!bgm.started) bgmInit(); else bgmApply(); });
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (!bgm.started && bgm.on) bgmInit(); }, { capture: true }));
document.addEventListener('visibilitychange', () => { if (!bgm.el) return; if (document.hidden) bgm.el.pause(); else bgmApply(); });

let rv = { cuts: [], level: -1 };
function revealSet(level){
  const cur = document.getElementById('curtain'); if (!cur) return;
  const segs = rv.cuts.length + 1;
  level = Math.max(0, Math.min(segs - 1, level));
  if (level <= rv.level) return;
  const prevTop = rv.level < 0 ? 0 : rv.cuts[rv.level];
  rv.level = level;
  if (level >= segs - 1) cur.classList.add('open'); else cur.style.top = (rv.cuts[level] * 100) + '%';
  const fl = document.getElementById('pgFlash');
  if (fl && segs > 1) {
    const bot = level >= segs - 1 ? 1 : rv.cuts[level];
    fl.style.top = (prevTop * 100) + '%'; fl.style.height = ((bot - prevTop) * 100) + '%';
    fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
  }
}
function revealStart(p){
  rv = { cuts: (window.BANDS[p] || []).slice(), level: -1 };
  const cur = document.getElementById('curtain'); if (!cur) return;
  cur.classList.remove('open'); cur.style.transition = 'none'; cur.style.top = '0%'; void cur.offsetWidth; cur.style.transition = '';

  revealSet(0);
}

function answerFor(q){

  const GEN = new Set(['legion', 'legionnaire', 'etranger', 'france', 'armee', 'militaire', 'soldat', 'aujourd', 'hui', 'maintenant', 'actuel', 'actuellement']);
  const spec = new Set([...qt].filter(w => !GEN.has(w)));
  for (const st of (window.KB_SMALLTALK || [])) if (st.k.some(k => raw.includes(' ' + norm(k) + ' ')) && qt.size <= 3) return { a: st.a };
  // 1. réponses préparées (manuel + informations de l'instructeur)
  let best = null, bs = 0;
  (window.KB || []).forEach(e => {
    if (e.all) { if (!e.all.every(g => g.some(k => has(qn, qt, k)))) return; }
    else if (!(e.must || e.k).some(k => has(qn, qt, k))) return;
    if (e.not && e.not.some(k => has(qn, qt, k))) return;
    if (!e.web && !e.k.some(k => has(qn, qt, k) && !GEN.has(stem(norm(k))))) return;
    const sc = 2 + (e.prio || 0) + e.k.filter(k => has(qn, qt, k)).length;
    if (sc > bs) { bs = sc; best = e; }
  });
  // 2. recherche dans tout le manuel (leçons + explications des quiz)
  const I = kbIndex(); let bd = null, bsc = 0, bhit = 0;
  I.docs.forEach(d => {
    let sc = 0, hit = 0; const dset = new Set(d.tk);
    let sh = 0;
    qt.forEach(w => { if (dset.has(w)) { sc += Math.log(1 + I.N / I.df[w]); hit++; if (spec.has(w)) sh++; } });
    if (!spec.size || !sh || sh / spec.size < 0.5) return;
    if (!(hit >= 2 || (hit >= 1 && hit / Math.max(1, qt.size) >= 0.6))) return;
    sc = sc / Math.sqrt(1 + qt.size);
    if (sc > bsc) { bsc = sc; bd = d; bhit = hit; }
  });
  if (/\b(aujourd hui|actuel|actuelle|actuellement|maintenant|en ce moment|cette annee|20[2-3][0-9])\b/.test(qn)) return { a: NOT_IN_MANUAL, web: true };
  if (best && best.web && !(bd && bsc > 3.2)) return { a: NOT_IN_MANUAL, web: true, wq: best.web };
  if (best && best.web) best = null;
  if (best && bs >= 3 && !(bd && bsc > 3.2 && bhit >= 3 && bs <= 3)) return { a: best.a, src: best.src };
  if (bd && bsc >= 1.5) {
    if (bd.quiz) return { a: bd.t + (bd.t.includes(bd.quiz.ok) ? '' : ' Réponse : ' + bd.quiz.ok + '.'), src: 'chapitre ' + bd.c.n + ', « ' + bd.c.title + ' »' };
    const sent = bd.t.split(/(?<=[.!?])\s+/);
    const scored = sent.map((x, i) => ({ x, i, s: toks(x).filter(w => qt.has(w)).length }));
    const rel = scored.filter(o => o.s > 0);
    const top = (rel.length ? rel.sort((a, b) => b.s - a.s).slice(0, 3).sort((a, b) => a.i - b.i) : scored.slice(0, 2)).map(o => o.x).join(' ');
    return { a: top, src: 'chapitre ' + bd.c.n + ', « ' + bd.c.title + ' », page ' + bd.p };

}

/* ---------- ARÈNE EN LIGNE : duel éclair 1 contre 1 (30 secondes) + classement de la semaine ----------
   Chaque joueur apparaît avec son personnage et son nom. Firestore (REST) : duels/{id}, weeks/{semaine}/scores/{uid}, reports/{id}. */
const AR = { time: 30000, wait: 30000, lead: 4000 };
const AR_BAD = /(merde|putain|connard|connasse|salope|encul|pute|niqu|fdp|batard|fuck|shit|bitch|cunt|dick|nigg|cazzo|stronz|puttan|vaffan|mierda|puta|cabron|pendej|hitler|nazi|porn|sexe|kurwa|blyat|сука|бля|хуй|orospu|siktir)/i;
const DOCROOT = `projects/${FB.project}/databases/(default)/documents`;
const arSleep = ms => new Promise(r => setTimeout(r, ms));
function fv(v){
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue; if ('integerValue' in v) return +v.integerValue; if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue; if ('timestampValue' in v) return Date.parse(v.timestampValue); return null;
}
function fdec(f){ const o = {}; for (const k in (f || {})) o[k] = fv(f[k]); return o; }
function fenc(x){
  if (x === null || x === undefined) return { nullValue: null }; if (typeof x === 'boolean') return { booleanValue: x };
  if (typeof x === 'number') return { integerValue: String(Math.round(x)) };
  if (x instanceof Date) return { timestampValue: x.toISOString() }; return { stringValue: String(x) };
}
function ffields(o){ const f = {}; for (const k in o) f[k] = fenc(o[k]); return f; }
async function fsReq(path, opt){
  const tk = await idToken(); const h = { 'Content-Type': 'application/json' }; if (tk) h.Authorization = 'Bearer ' + tk;
  const r = await fetch(FB_DOCS + path, Object.assign({ headers: h }, opt || {}));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error('Firestore ' + r.status); e.status = r.status; throw e; }
  return j;
}
function weekId(d){
  d = d || new Date(); const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7); return y + '-W' + String(w).padStart(2, '0');
}
/* questions : chapitres gratuits, sans image ; chacun les voit dans sa langue */
const AR_POOL = (() => { const p = []; C.forEach((c, ci) => { if (c.paid) return; c.quiz.forEach((q, qi) => { if (!q.img && !q.pic && typeof q.a === 'number' && q.o && q.o.length >= 3) p.push([ci, qi]); }); }); return p; })();
function arRng(seed){ let s = (seed >>> 0) || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
function arStream(seed){ // suite sans fin, identique pour les deux joueurs
  const r = arRng(seed); const idx = AR_POOL.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return k => { const [ci, qi] = AR_POOL[idx[k % idx.length]]; const q = C[ci].quiz[qi]; const rr = arRng(seed ^ Math.imul(k + 1, 2654435761)); const ord = q.o.map((_, i) => i);
    for (let i = ord.length - 1; i > 0; i--) { const j = Math.floor(rr() * (i + 1)); [ord[i], ord[j]] = [ord[j], ord[i]]; } return { q, ord }; };
}
function arCount(str, get){ let ok = 0; String(str || '').split('|').filter(x => x !== '').forEach((c, k) => { if (+c === get(k).q.a) ok++; }); return ok; }
function arSkinN(){ const s = curSkin(); return s ? s.n : 0; }
function arSkinName(n){ const s = SKINS.find(x => x.n === +n); return s ? s.name : 'Instructeur'; }
function arAv(n, cls){ n = Math.max(0, Math.min(10, +n || 0)); return `<span class="ar-av sk${n} ${cls || ''}" aria-hidden="true"></span>`; }

async function arenaMe(){

function arPseudoOk(p){ return /^[\p{L}\p{N} _.\-]{3,16}$/u.test(p || '') && !AR_BAD.test(String(p).replace(/[\s_.\-0-9]/g, '')); }
async function arScoreAdd(add, win, best){
  const path = `/weeks/${weekId()}/scores/${AR_ME.uid}`; let cur = {};
  try { cur = fdec((await fsReq(path)).fields); } catch(e){ if (e.status && e.status !== 404) throw e; }
  const n = { pseudo: store._pseudo, skin: arSkinN(), pts: (cur.pts || 0) + add, wins: (cur.wins || 0) + (win ? 1 : 0), played: (cur.played || 0) + 1, best: Math.max(cur.best || 0, Math.min(60, best)), updated: new Date() };
  await fsReq(path, { method: 'PATCH', body: JSON.stringify({ fields: ffields(n) }) });
}
async function arBoard(){
  const j = await fsReq(`/weeks/${weekId()}:runQuery`, { method: 'POST', body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'scores' }], orderBy: [{ field: { fieldPath: 'pts' }, direction: 'DESCENDING' }], limit: 50 } }) });
  return (Array.isArray(j) ? j : []).filter(x => x.document).map(x => Object.assign({ uid: x.document.name.split('/').pop(), path: x.document.name }, fdec(x.document.fields)));
}

    <div class="card ar-card" style="text-align:center"><div class="ar-wait">${arAv(sk, 'big')}<div class="ar-radar"></div></div><p id="arSt">Connexion à l'arène…</p></div></div>`;
  let myDuel = null;
  document.getElementById('bk').onclick = async () => { AR_CANCEL = true; if (myDuel) { try { await fsReq('/duels/' + myDuel, { method: 'DELETE' }); } catch(e){} } arenaView(); };
  const st = t => { const e = document.getElementById('arSt'); if (e) e.textContent = t; };
  try {
    const j = await fsReq(':runQuery', { method: 'POST', body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'duels' }], where: { fieldFilter: { field: { fieldPath: 'state' }, op: 'EQUAL', value: { stringValue: 'open' } } }, limit: 10 } }) });
    const open = (Array.isArray(j) ? j : []).filter(x => x.document).map(x => ({ name: x.document.name, ut: x.document.updateTime, d: fdec(x.document.fields) }))
      .filter(o => o.d.p1 !== AR_ME.uid && Date.now() - (o.d.created || 0) < 40000);
    for (const o of open) {
      if (AR_CANCEL) return;
      try {
        const r = await fsReq(':commit', { method: 'POST', body: JSON.stringify({ writes: [{ update: { name: o.name, fields: ffields({ p2: AR_ME.uid, n2: store._pseudo, k2: sk, state: 'playing' }) }, updateMask: { fieldPaths: ['p2', 'n2', 'k2', 'state'] }, currentDocument: { updateTime: o.ut }, updateTransforms: [{ fieldPath: 'startAt', setToServerValue: 'REQUEST_TIME' }] }] }) });
        const srv = Date.parse(r.commitTime), off = srv - Date.now();
        return duelPlay({ id: o.name.split('/').pop(), me: 2, opp: o.d.n1, oppSk: o.d.k1, seed: o.d.seed, start: srv + AR.lead - off });
      } catch(e){ /* déjà pris par quelqu'un d'autre */ }
    }
    if (AR_CANCEL) return;
    const id = Array.from(crypto.getRandomValues(new Uint8Array(20)), b => (b % 36).toString(36)).join('');
    const seed = crypto.getRandomValues(new Uint32Array(1))[0] & 0x7fffffff;
    const r = await fsReq(':commit', { method: 'POST', body: JSON.stringify({ writes: [{ update: { name: `${DOCROOT}/duels/${id}`, fields: ffields({ state: 'open', p1: AR_ME.uid, n1: store._pseudo, k1: sk, seed, a1: '', a2: '' }) }, currentDocument: { exists: false }, updateTransforms: [{ fieldPath: 'created', setToServerValue: 'REQUEST_TIME' }] }] }) });
    myDuel = id; const off = Date.parse(r.commitTime) - Date.now();
    const t0 = Date.now();
    while (Date.now() - t0 < AR.wait) {
      if (AR_CANCEL) return;
      st(`En attente d'un adversaire… ${Math.ceil((AR.wait - (Date.now() - t0)) / 1000)} s`);
      await arSleep(1500);
      let d; try { d = fdec((await fsReq('/duels/' + id)).fields); } catch(e){ continue; }
      if (d.state === 'playing' && d.startAt) return duelPlay({ id, me: 1, opp: d.n2, oppSk: d.k2, seed, start: d.startAt + AR.lead - off });
    }
    try { await fsReq('/duels/' + id, { method: 'DELETE' }); } catch(e){}
    myDuel = null; if (AR_CANCEL) return;
    const box = document.querySelector('.ar-card');
    box.innerHTML = `<p>Aucun adversaire en ligne pour le moment.</p><div class="row" style="justify-content:center"><button class="btn" id="arRe">Réessayer</button><button class="btn ghost" id="arBot">Entraînement contre l'instructeur (sans points)</button></div>`;
    document.getElementById('arRe').onclick = duelLobby;
    document.getElementById('arBot').onclick = () => duelPlay({ bot: true, me: 1, opp: 'Instructeur', oppSk: 0, seed: crypto.getRandomValues(new Uint32Array(1))[0], start: Date.now() + AR.lead });
  } catch(e){ st('Arène indisponible (' + (e.status || e.message) + '). Réessayez plus tard.'); }
}

/* ---- le duel éclair : 30 secondes, autant de questions que possible ---- */
async function duelPlay(m){
  stopTalk(); state.view = 'arena-duel'; AR_CANCEL = false; top();
  const get = arStream(m.seed), end = m.start + AR.time;
  const myField = m.me === 1 ? 'a1' : 'a2', oppField = m.me === 1 ? 'a2' : 'a1';
  const mine = []; let opp = '', k = 0, over = false;
  app.innerHTML = `<div class="wrap view ar-duel">
    <div class="ar-score"><div class="ar-side">${arAv(arSkinN())}<b class="notr" translate="no">${esc(store._pseudo)}</b><span id="sMe">0</span></div><div class="ar-vs"><span id="tLeft">30</span><small>s</small></div><div class="ar-side">${arAv(m.oppSk)}<b class="notr" translate="no">${esc(m.opp || '?')}</b><span id="sOp">0</span></div></div>
    <div class="ar-timer"><i id="tBar"></i></div><p class="muted" id="qN"></p><h3 id="qT">Prêt ?</h3><div id="qO" class="ar-opts"></div><p id="qF" class="muted"></p>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="arQuit">Abandonner</button></div></div>`;
  document.getElementById('arQuit').onclick = () => { if (confirm('Abandonner le duel ? Il compte comme une défaite.')) { AR_CANCEL = true; over = true; arenaView(); } };
  const myOk = () => arCount(mine.join('|'), get);
  const paint = () => { const a = document.getElementById('sMe'), b = document.getElementById('sOp'); if (a) a.textContent = myOk(); if (b) b.textContent = arCount(opp, get); };
  let poll;
  if (m.bot) {
    const r = arRng(m.seed ^ 0x9e3779b9), plan = []; let t = 0, kk = 0;
    while (t < AR.time) { t += 1800 + r() * 2600; const q = get(kk++); const wrong = q.q.o.map((_, i) => i).filter(i => i !== q.q.a); plan.push({ t, c: r() < .72 ? q.q.a : wrong[Math.floor(r() * wrong.length)] }); }
    poll = setInterval(() => { const el = Date.now() - m.start; opp = plan.filter(p => p.t <= Math.min(el, AR.time)).map(p => p.c).join('|'); paint(); }, 400);
  } else {
    poll = setInterval(async () => { if (over) return; try { const d = fdec((await fsReq('/duels/' + m.id)).fields); opp = d[oppField] || ''; paint(); } catch(e){} }, 1500);
  }
  let lastPush = 0, pushT = null;
  const push = force => { if (m.bot) return; const send = () => { lastPush = Date.now(); return fsReq(`/duels/${m.id}?updateMask.fieldPaths=${myField}`, { method: 'PATCH', body: JSON.stringify({ fields: ffields({ [myField]: mine.join('|') }) }) }).catch(() => {}); };
    clearTimeout(pushT); if (force || Date.now() - lastPush > 800) return send(); pushT = setTimeout(send, 800); };
  while (Date.now() < m.start) { if (AR_CANCEL) break; const e = document.getElementById('qF'); if (e) e.textContent = 'Début dans ' + Math.ceil((m.start - Date.now()) / 1000) + ' s'; await arSleep(200); }
  const clock = setInterval(() => { const left = Math.max(0, end - Date.now()); const b = document.getElementById('tBar'), s = document.getElementById('tLeft'); if (b) b.style.width = (left / AR.time * 100) + '%'; if (s) s.textContent = Math.ceil(left / 1000); }, 100);
  while (!AR_CANCEL && Date.now() < end) {
    const { q, ord } = get(k);
    document.getElementById('qN').textContent = `Question ${k + 1}`;
    document.getElementById('qT').textContent = q.q; document.getElementById('qF').textContent = '';
    const box = document.getElementById('qO'); box.innerHTML = ord.map(i => `<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('');
    const c = await new Promise(res => {
      let done = false; const stop = setInterval(() => { if ((Date.now() >= end || AR_CANCEL) && !done) { done = true; clearInterval(stop); res(null); } }, 100);
      box.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (done) return; done = true; clearInterval(stop); res(+b.dataset.i); });
    });
    if (c === null) break;
    mine.push(c); k++; push(); paint();
    box.querySelectorAll('.opt').forEach(b => { b.disabled = true; const i = +b.dataset.i; if (i === q.a) b.classList.add('ok'); else if (i === c) b.classList.add('bad'); });
    document.getElementById('qF').textContent = c === q.a ? '✓' : '✗';
    await arSleep(c === q.a ? 350 : 700);
  }
  clearInterval(clock); over = true; await push(true);
  if (AR_CANCEL) { clearInterval(poll); if (!m.bot) { try { await arScoreAdd(5, false, myOk()); } catch(e){} } return; }
  document.getElementById('qT').textContent = 'Temps écoulé !'; document.getElementById('qO').innerHTML = ''; document.getElementById('qF').textContent = 'Calcul du résultat…';
  if (!m.bot) { await arSleep(2500); try { const d = fdec((await fsReq('/duels/' + m.id)).fields); opp = d[oppField] || ''; } catch(e){} }
  clearInterval(poll);
  const a = myOk(), b = arCount(opp, get);
  const res = a > b ? 'win' : a < b ? 'loss' : 'draw', add = res === 'win' ? 30 : res === 'draw' ? 15 : 5;
  if (!m.bot) {
    try { await arScoreAdd(add, res === 'win', a); } catch(e){}
    if (m.me === 1) setTimeout(() => fsReq('/duels/' + m.id, { method: 'DELETE' }).catch(() => {}), 8000);
  }
  try { STATS.hit('game'); } catch(e){}
  const title = res === 'win' ? '🏆 Victoire !' : res === 'draw' ? '🤝 Match nul' : '💪 Défaite';
  app.innerHTML = `<div class="wrap view"><div class="crumb"><span class="mode">Duel terminé</span><h2>${title}</h2></div>
    <div class="ar-score big"><div class="ar-side">${arAv(arSkinN(), 'big')}<b class="notr" translate="no">${esc(store._pseudo)}</b><span>${a}</span></div><div class="ar-vs">VS</div><div class="ar-side">${arAv(m.oppSk, 'big')}<b class="notr" translate="no">${esc(m.opp || '?')}</b><span>${b}</span></div></div>
    <p class="muted">Bonnes réponses en 30 secondes.</p>
    <p class="muted">${m.bot ? 'Duel d\'entraînement : il ne compte pas au classement.' : `+${add} points au classement de la semaine.`}</p>
    <div class="row"><button class="btn" id="arAgain">Rejouer</button><button class="btn ghost" id="arBack">Classement</button></div></div>`;
  document.getElementById('arAgain').onclick = duelLobby; document.getElementById('arBack').onclick = () => arenaView();
  try { speak(res === 'win' ? 'Victoire ! Bien joué.' : res === 'draw' ? 'Match nul. Vous étiez au même niveau.' : 'Défaite. Révisez et revenez plus fort.'); } catch(e){}
  if (typeof adGate === 'function') { try { adGate(() => {}); } catch(e){} }
}

/* ---------- boot ---------- */
const state = {};
Object.defineProperty(state, 'view', { set(v){ this._v = v; document.body.dataset.view = v; }, get(){ return this._v; } });
document.getElementById('homeBtn').addEventListener('click', () => { legerStopAudio(); lg = null; if (state.view === 'stand') stStop(); if (state.view === 'drone') drStop(); home(); });
document.addEventListener('keydown', e => {
  if (document.querySelector('.lb')) return;
  if (state.view === 'lesson') {
    if (e.key === 'ArrowRight') document.getElementById('next').click();
    if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopTalk(); });
if (store._name) home(); else onboarding();
try { STATS.open(); } catch(e){}
authCheck().then(() => { if (isAdmin() && state.view === 'home') home(); });
billRefresh().then(() => { if (state.view === 'skins') skinsView(false); else if (state.view === 'home') renderRank(); });
})();
</script>
